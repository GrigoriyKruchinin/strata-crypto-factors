[project]
name = "strata"
version = "0.1.0.dev0"
description = "Systematic market-neutral factor portfolio for crypto perpetual futures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "pyarrow>=18.0",
]

[project.scripts]
strata = "strata.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14",
    "celery-types>=0.22",
    "respx>=0.21",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "TID", "PL", "DTZ", "T20", "S"]
ignore = [
    "PLR0913",  # factor/backtest configs legitimately take many params
    "PLR2004",  # magic numbers are common in financial formulas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "PLR0917"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["strata"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires running services (postgres/redis/network)"]
