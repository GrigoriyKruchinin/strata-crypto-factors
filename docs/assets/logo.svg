<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title">
  <title id="title">Strata logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="184" height="184" rx="40" fill="url(#bg)"/>
  <!-- Long layers (above the neutral line) -->
  <rect x="44" y="46" width="112" height="16" rx="8" fill="#34d399"/>
  <rect x="56" y="72" width="88" height="16" rx="8" fill="#34d399" opacity="0.75"/>
  <!-- Market-neutral line -->
  <rect x="32" y="98" width="136" height="4" rx="2" fill="#e2e8f0"/>
  <!-- Short layers (below the neutral line) -->
  <rect x="56" y="112" width="88" height="16" rx="8" fill="#f87171" opacity="0.75"/>
  <rect x="44" y="138" width="112" height="16" rx="8" fill="#f87171"/>
</svg>
