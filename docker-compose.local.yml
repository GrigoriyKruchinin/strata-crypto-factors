# Stage 1 local stack: public data only, no exchange keys.
# Each role receives only the variables it needs (no shared env_file).

x-app: &app
  build: .
  image: strata:local
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-strata}
  DB_USER: ${DB_USER:-strata}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

x-redis-env: &redis-env
  REDIS_URL: redis://redis:6379/0

# Workers are named <queue>@<hostname>; CELERY_NODE selects which one to ping.
x-worker-health: &worker-health
  test: ["CMD-SHELL", "celery -A strata.infra.celery_app inspect ping -d $${CELERY_NODE}@$$HOSTNAME --timeout 10 || exit 1"]
  interval: 60s
  timeout: 20s
  retries: 3
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-strata}
      POSTGRES_USER: ${DB_USER:-strata}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrations:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
    depends_on:
      postgres: { condition: service_healthy }

  # Downloads / refreshes market data (public endpoints only).
  data-loader:
    <<: *app
    command: ["celery", "-A", "strata.infra.celery_app", "worker", "-Q", "data", "-c", "1", "-n", "data@%h", "--loglevel", "INFO"]
    environment:
      CELERY_NODE: data
      <<: [*db-env, *redis-env]
      DATA_ROOT_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck: *worker-health
    depends_on:
      redis: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }

  # Virtual account: same signals and cost model as the backtest, state in Postgres.
  paper-trader:
    <<: *app
    command: ["celery", "-A", "strata.infra.celery_app", "worker", "-Q", "paper", "-c", "1", "-n", "paper@%h", "--loglevel", "INFO"]
    environment:
      CELERY_NODE: paper
      <<: [*db-env, *redis-env]
      DATA_ROOT_DIR: /app/data
      PAPER_ACCOUNT: ${PAPER_ACCOUNT:-paper}
      PAPER_INITIAL_EQUITY: ${PORTFOLIO_CAPITAL_USDT:-3000}
      PAPER_FROZEN_CANDIDATES_PATH: /app/docs/research/frozen-candidates.json
    volumes:
      - ./data:/app/data:ro
      - ./docs/research:/app/docs/research:ro
    healthcheck: *worker-health
    depends_on:
      redis: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }

  # Only this role sees the Telegram token.
  telegram-worker:
    <<: *app
    command: ["celery", "-A", "strata.infra.celery_app", "worker", "-Q", "notify", "-c", "1", "-n", "notify@%h", "--loglevel", "INFO"]
    environment:
      CELERY_NODE: notify
      <<: *redis-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    healthcheck: *worker-health
    depends_on:
      redis: { condition: service_healthy }

  beat:
    <<: *app
    command: ["celery", "-A", "strata.infra.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *redis-env
    healthcheck:
      # Beat persists its schedule file every few minutes while alive.
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/tmp/celerybeat-schedule*'); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f))<900 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      data-loader: { condition: service_healthy }
      paper-trader: { condition: service_healthy }
      telegram-worker: { condition: service_healthy }

  # One-shot research runs: `docker compose -f docker-compose.local.yml run --rm backtester research train`
  backtester:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    entrypoint: ["strata"]
    command: ["--help"]
    environment:
      DATA_ROOT_DIR: /app/data
      RESEARCH_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - ./docs/research:/app/docs/research

volumes:
  pgdata:
  redisdata:
